<title>Access Events — Accessible iPad Onboarding Prototype</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<style>
  /* ============================= BASE ============================= */
  * {
    box-sizing: border-box;
  }
  html,
  body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
  }
  body {
    background: #000;
    font-family:
      -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* ============================= FULL-SCREEN STAGE ============================= */
  /* The whole viewport IS the iPad — no outer chrome, no scaling frame. */
  #stage {
    width: 100vw;
    height: 100dvh;
  }
  #app {
    width: 100%;
    height: 100%;
    overflow: hidden;
    position: relative;
  }

  /* ============================= APP SHELL ============================= */
  #app {
    --text-scale: 1;
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    font-size: calc(17px * var(--text-scale));
  }
  #app * {
    font-family: inherit;
  }

  /* ---- color mode: standard / ios(light) ---- */
  #app[data-color-mode="standard"],
  #app[data-color-mode="ios"] {
    --app-bg: #faf7f2;
    --app-surface: #ffffff;
    --app-surface-2: #f1eadc;
    --app-ink: #1c2321;
    --app-muted: #5b6b68;
    --app-border: #e3dacb;
    --app-border-w: 1px;
    --app-accent: #119ec4;
    --app-accent-ink: #ffffff;
    --app-accent-soft: #e1f2f8;
    --app-accent-2: #d10074;
    --app-accent-2-soft: #fbe0ee;
    --app-focus: #119ec4;
    --app-success: #1f7a4d;
    --app-danger: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    #app[data-color-mode="ios"] {
      --app-bg: #10201d;
      --app-surface: #182c28;
      --app-surface-2: #1f3733;
      --app-ink: #f2efe7;
      --app-muted: #a9bdb8;
      --app-border: #2c4640;
      --app-border-w: 1px;
      --app-accent: #4dc6e8;
      --app-accent-ink: #072a33;
      --app-accent-soft: #12414e;
      --app-accent-2: #ff5fae;
      --app-accent-2-soft: #45182e;
      --app-focus: #4dc6e8;
      --app-success: #6fe0a0;
      --app-danger: #ff8b82;
    }
  }
  /* ---- color mode: high contrast ---- */
  #app[data-color-mode="high-contrast"] {
    --app-bg: #000000;
    --app-surface: #000000;
    --app-surface-2: #0d0d0d;
    --app-ink: #ffffff;
    --app-muted: #ffffff;
    --app-border: #ffffff;
    --app-border-w: 2px;
    --app-accent: #ffd60a;
    --app-accent-ink: #000000;
    --app-accent-soft: #3a3100;
    --app-accent-2: #ffd60a;
    --app-accent-2-soft: #3a3100;
    --app-focus: #ffd60a;
    --app-success: #7cff6b;
    --app-danger: #ff6b6b;
  }
  /* ---- color mode: black & white ---- */
  #app[data-color-mode="bw"] {
    --app-bg: #ffffff;
    --app-surface: #ffffff;
    --app-surface-2: #efefef;
    --app-ink: #000000;
    --app-muted: #3b3b3b;
    --app-border: #000000;
    --app-border-w: 2px;
    --app-accent: #000000;
    --app-accent-ink: #ffffff;
    --app-accent-soft: #ededed;
    --app-accent-2: #000000;
    --app-accent-2-soft: #ededed;
    --app-focus: #000000;
    --app-success: #000000;
    --app-danger: #000000;
  }

  #app {
    background: var(--app-bg);
    color: var(--app-ink);
  }

  /* ---- button style variants ---- */
  #app[data-button-style="large-icon"] {
    --btn-min-h: 60px;
    --btn-pad: 0.85rem 1.3rem;
    --btn-icon: 1;
    --btn-fs: 1.02rem;
    --btn-radius: 16px;
  }
  #app[data-button-style="large-text"] {
    --btn-min-h: 60px;
    --btn-pad: 0.85rem 1.4rem;
    --btn-icon: 0;
    --btn-fs: 1.05rem;
    --btn-radius: 16px;
  }
  #app[data-button-style="standard-icon"] {
    --btn-min-h: 46px;
    --btn-pad: 0.6rem 1rem;
    --btn-icon: 1;
    --btn-fs: 0.92rem;
    --btn-radius: 12px;
  }
  #app[data-button-style="standard-text"] {
    --btn-min-h: 46px;
    --btn-pad: 0.6rem 1.1rem;
    --btn-icon: 0;
    --btn-fs: 0.94rem;
    --btn-radius: 12px;
  }
  .btn-icon-slot {
    display: none;
  }
  #app[data-button-style$="icon"] .btn-icon-slot {
    display: inline-flex;
  }

  /* ============================= LAYOUT PRIMITIVES ============================= */
  .screen {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }
  .scr-header {
    padding: clamp(14px, 2.4vh, 26px) clamp(20px, 3vw, 40px) 0;
  }
  .scr-body {
    padding: 6px clamp(20px, 3vw, 40px);
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .scr-footer {
    padding: clamp(12px, 2vh, 20px) clamp(20px, 3vw, 40px)
      clamp(16px, 2.6vh, 28px);
    border-top: var(--app-border-w) solid var(--app-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: var(--app-surface);
  }

  .eyebrow-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .step-pill {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--app-muted);
    font-variant-numeric: tabular-nums;
  }
  .top-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  h1.scr-title {
    font-family:
      ui-rounded,
      "SF Pro Rounded",
      -apple-system,
      system-ui,
      sans-serif;
    font-size: clamp(1.3rem, 2.6vw, 1.85rem);
    margin: 0 0 6px;
    text-wrap: balance;
    letter-spacing: -0.01em;
  }
  p.scr-explain {
    margin: 0 0 14px;
    color: var(--app-muted);
    line-height: 1.5;
    font-size: 1rem;
    max-width: 70ch;
  }

  /* progress bar */
  .progress-track {
    height: 8px;
    border-radius: 99px;
    background: var(--app-surface-2);
    border: var(--app-border-w) solid var(--app-border);
    overflow: hidden;
    margin-top: 10px;
  }
  .progress-fill {
    height: 100%;
    background: var(--app-accent);
    border-radius: 99px;
  }
  @media (prefers-reduced-motion: no-preference) {
    .progress-fill {
      transition: width 0.3s ease;
    }
  }

  /* buttons (generic) */
  .btn {
    font-size: var(--btn-fs, 0.95rem);
    font-weight: 700;
    min-height: var(--btn-min-h, 46px);
    border-radius: var(--btn-radius, 12px);
    padding: var(--btn-pad, 0.6rem 1rem);
    border: var(--app-border-w) solid var(--app-border);
    background: var(--app-surface);
    color: var(--app-ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    line-height: 1.15;
  }
  .icon-svg {
    width: 1.15em;
    height: 1.15em;
    flex: none;
    display: inline-block;
    vertical-align: -0.15em;
  }
  .hero-thumb svg {
    width: 2em;
    height: 2em;
  }
  .event-thumb svg {
    width: 1.5em;
    height: 1.5em;
  }
  .btn:hover {
    border-color: var(--app-accent);
  }
  .btn:focus-visible {
    outline: 3px solid var(--app-focus);
    outline-offset: 2px;
  }
  .btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .btn-primary {
    background: var(--app-accent);
    color: var(--app-accent-ink);
    border-color: var(--app-accent);
  }
  .btn-ghost {
    background: transparent;
  }
  .btn-danger-outline {
    border-color: var(--app-danger);
    color: var(--app-danger);
  }
  .btn-sm {
    min-height: 44px;
    padding: 0.45rem 0.85rem;
    font-size: 0.85rem;
    border-radius: 10px;
  }
  .btn-block {
    width: 100%;
    justify-content: flex-start;
    text-align: left;
  }
  .icon-only-hidden-label {
  }

  /* choice cards (radio/checkbox style) */
  .choice-grid {
    display: grid;
    gap: 10px;
    flex: 1;
    min-height: 0;
    grid-auto-rows: 1fr;
  }
  .choice-card {
    border: var(--app-border-w) solid var(--app-border);
    background: var(--app-surface);
    border-radius: 14px;
    padding: 8px 16px;
    display: flex;
    gap: 10px;
    align-items: center;
    cursor: pointer;
    text-align: left;
    width: 100%;
    min-height: 0;
    overflow: hidden;
  }
  .choice-card:focus-visible {
    outline: 3px solid var(--app-focus);
    outline-offset: 2px;
  }
  .choice-card[aria-checked="true"],
  .choice-card[aria-pressed="true"] {
    border-color: var(--app-accent);
    background: var(--app-accent-soft);
    box-shadow: 0 0 0 3px var(--app-accent);
  }
  .choice-check-badge {
    flex: none;
    color: var(--app-accent);
  }
  .choice-body {
    flex: 1;
    min-width: 0;
  }
  .choice-title {
    font-weight: 800;
    font-size: 1.2em;
    line-height: 1.2;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .choice-sub {
    color: var(--app-muted);
    font-size: 0.95em;
    margin-top: 2px;
    line-height: 1.35;
  }

  /* surfaces / cards */
  .surface {
    background: var(--app-surface);
    border: var(--app-border-w) solid var(--app-border);
    border-radius: 18px;
    padding: 16px;
  }
  .surface-2 {
    background: var(--app-surface-2);
    border: var(--app-border-w) solid var(--app-border);
    border-radius: 18px;
    padding: 16px;
  }

  /* chips */
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 700;
    padding: 6px 12px;
    border-radius: 99px;
    border: var(--app-border-w) solid var(--app-border);
    background: var(--app-surface-2);
    color: var(--app-ink);
  }
  .chip.on {
    background: var(--app-accent);
    color: var(--app-accent-ink);
    border-color: var(--app-accent);
  }
  .chip.tag-free {
    background: var(--app-success);
    color: #fff;
    border-color: var(--app-success);
  }
  #app[data-color-mode="bw"] .chip.tag-free {
    background: var(--app-ink);
    color: var(--app-bg);
  }
  #app[data-color-mode="high-contrast"] .chip.tag-free {
    color: #000;
  }

  /* focus ring globally inside app */
  #app :focus {
    outline: none;
  }
  #app :focus-visible {
    outline: 3px solid var(--app-focus);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* pagination footer */
  .pager {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .pager-status {
    font-size: 0.85rem;
    color: var(--app-muted);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    min-width: 120px;
    text-align: center;
  }

  /* grid of event cards */
  .event-grid {
    display: grid;
    gap: 16px;
    flex: 1;
    min-height: 0;
  }
  .event-card {
    border: var(--app-border-w) solid var(--app-border);
    background: var(--app-surface);
    border-radius: 18px;
    padding: 14px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px;
    align-items: center;
    cursor: pointer;
    text-align: left;
    width: 100%;
    min-height: 0;
    overflow: hidden;
  }
  .event-card:focus-visible {
    outline: 3px solid var(--app-focus);
    outline-offset: 2px;
  }
  .event-thumb {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .event-card h3 {
    margin: 0 0 2px;
    font-size: 1.05em;
    line-height: 1.25;
  }
  .event-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    color: var(--app-muted);
    font-size: 0.85em;
    margin-top: 4px;
  }
  .event-meta span {
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  /* single event hero card */
  .hero-card {
    flex: 1;
    display: grid;
    grid-template-columns: minmax(180px, 34%) 1fr;
    gap: 22px;
    min-height: 0;
  }
  .hero-thumb {
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-info {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow: hidden;
  }

  /* filter grid */
  .filter-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media (min-aspect-ratio: 4/3) {
    .filter-grid.activities {
      grid-template-columns: repeat(3, 1fr);
    }
  }

  /* device orientation helper classes set programmatically via inline width/height */
  .help-banner {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    background: var(--app-accent-soft);
    border: var(--app-border-w) solid var(--app-accent);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 12px;
  }

  .a11y-badge-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .a11y-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 0.82rem;
    font-weight: 600;
    padding: 6px 10px;
    border-radius: 10px;
    border: var(--app-border-w) solid var(--app-border);
  }
  .a11y-badge.confirmed {
    background: var(--app-success);
    color: #fff;
    border-color: var(--app-success);
  }
  .a11y-badge.unknown {
    background: var(--app-surface-2);
    color: var(--app-muted);
    border-style: dashed;
  }
  .a11y-badge.contact {
    background: var(--app-accent-2-soft);
    color: var(--app-accent-2);
    border-color: var(--app-accent-2);
  }
  #app[data-color-mode="bw"] .a11y-badge.confirmed {
    background: var(--app-ink);
    color: var(--app-bg);
  }
  #app[data-color-mode="high-contrast"] .a11y-badge.confirmed {
    color: #000;
  }

  ::-webkit-scrollbar {
    display: none;
  }
</style>

<div id="stage">
  <div id="app" role="application" aria-label="Access Events app"></div>
</div>
<div id="liveRegion" class="sr-only" aria-live="polite"></div>

    /* ============================= SPEECH ============================= */
    var speech = { utter: null, playing: false, paused: false, text: "" };
    function speak(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text);
      u.rate = 0.95;
      u.onend = function () {
        speech.playing = false;
        speech.paused = false;
        updateSpeechUI();
      };
      u.onstart = function () {
        speech.playing = true;
        speech.paused = false;
        updateSpeechUI();
      };
      speech.utter = u;
      speech.text = text;
      window.speechSynthesis.speak(u);
      updateSpeechUI();
    }
    function speechPause() {
      if ("speechSynthesis" in window && speech.playing) {
        window.speechSynthesis.pause();
        speech.paused = true;
        updateSpeechUI();
      }
    }
    function speechResume() {
      if ("speechSynthesis" in window && speech.paused) {
        window.speechSynthesis.resume();
        speech.paused = false;
        updateSpeechUI();
      }
    }
    function speechStop() {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
      speech.playing = false;
      speech.paused = false;
      updateSpeechUI();
    }
    function speechReplay() {
      if (speech.text) speak(speech.text);
    }
    function updateSpeechUI() {
      var root = document.getElementById("app");
      if (!root) return;
      root.querySelectorAll("[data-speech-controls]").forEach(function (box) {
        var playBtn = box.querySelector('[data-sp="play"]');
        var pauseBtn = box.querySelector('[data-sp="pause"]');
        if (playBtn)
          playBtn.style.display =
            speech.playing && !speech.paused ? "none" : "inline-flex";
        if (pauseBtn)
          pauseBtn.style.display =
            speech.playing && !speech.paused ? "inline-flex" : "none";
      });
    }

            ONB_STEPS.length +

    /* ============================= MAIN APP: BROWSE ============================= */
    function filteredEvents() {
      var rank = { today: 0, week: 1, month: 2, upcoming: 3 };
      var tf = state.filters.time;
      return EVENTS.filter(function (ev) {
        if (tf && rank[ev.when] > rank[tf]) return false;
        if (
          state.filters.activities.length &&
          state.filters.activities.indexOf(ev.cat) === -1
        )
          return false;
        if (state.costPref === "free" && ev.cost > 0) return false;
        return true;
      });
    }
    function activeFilterChips() {
      var chips = [];
      var timeLabels = {
        today: "Today",
        week: "This Week",
        month: "This Month",
        upcoming: "All Upcoming",
      };
      chips.push(
        '<span class="chip on">' +
          icon("clock") +
          " " +
          timeLabels[state.filters.time] +
          "</span>",
      );
      state.filters.activities.forEach(function (a) {
        chips.push(
          '<span class="chip on">' +
            icon(CATS[a].icon) +
            " " +
            CATS[a].label +
            "</span>",
        );
      });
      return chips.join("");
    }

        "</div>";
      var footer =
        '<button class="btn" id="settingsBack">' +
        icon("chevronLeft") +
        "<span>Back to Events</span></button><div></div><div></div>";
      return (
        '<div class="screen">' +
        header +
        '<div class="scr-body">' +
        body +
        '</div><div class="scr-footer">' +
        footer +
        "</div></div>"
      );
    }

    /* ============================= ROUTER ============================= */
    function renderScreen() {
      if (state.helpOpen) return renderHelpOverlay();
      switch (state.screen) {
        case "onb":
          return renderOnbStep();
        case "browse":
          return rBrowse();
        case "filters":
          return rFilters();
        case "details":
          return rDetails();
        case "register":
          return rRegister();
        case "settings":
          return rSettings();
        default:
          return rBrowse();
      }
    }

    /* ============================= WIRING ============================= */
    function wireScreen(app) {
      // radios
      on(app, "[data-radio]", "click", function (e) {
        var name = e.currentTarget.getAttribute("data-radio"),
          val = e.currentTarget.getAttribute("data-value");
        if (name === "filterTime") {
          state._filterDraft.time = val;
          render(false);
          return;
        }
        var patch = {};
        patch[name] = val;
        update(patch);
      });
      on(app, "[data-check]", "click", function (e) {
        var name = e.currentTarget.getAttribute("data-check"),
          val = e.currentTarget.getAttribute("data-value");
        if (name === "filterAct") {
          var arr = state._filterDraft.activities.slice();
          var i = arr.indexOf(val);
          if (i > -1) arr.splice(i, 1);
          else arr.push(val);
          state._filterDraft.activities = arr;
          render(false);
          return;
        }
        var arr = state[name].slice();
        var i = arr.indexOf(val);
        if (i > -1) arr.splice(i, 1);
        else arr.push(val);
        var patch = {};
        patch[name] = arr;
        update(patch);
      });
      var locInput = app.querySelector("#locInput");
      if (locInput) {
        locInput.addEventListener("input", function (e) {
          state.locationValue = e.target.value;
          saveState();
        });
      }

      // quick settings
      var qsAa = app.querySelector("#qsAa");
      if (qsAa)
        qsAa.addEventListener("click", function () {
          var existing = app.querySelector("#textSizeMenu");
          if (existing) {
            existing.remove();
            return;
          }
          var div = document.createElement("div");
          div.id = "textSizeMenu";
          div.innerHTML = textSizeMenu();
          app.querySelector(".screen").appendChild(div);
          div.querySelectorAll("[data-textsize]").forEach(function (b) {
            b.addEventListener("click", function () {
              update({ textSize: b.getAttribute("data-textsize") });
            });
          });
          div
            .querySelector("#qsAaClose")
            .addEventListener("click", function () {
              div.remove();
            });
        });
      var qsHelp = app.querySelector("#qsHelp");
      if (qsHelp)
        qsHelp.addEventListener("click", function () {
          state.helpOpen = true;
          render(true);
        });
      var closeHelp = app.querySelector("#closeHelp");
      if (closeHelp)
        closeHelp.addEventListener("click", function () {
          state.helpOpen = false;
          render(true);
        });

      // speech
      on(app, "[data-say]", "click", function (e) {
        speak(e.currentTarget.getAttribute("data-say"));
      });
      on(app, "[data-sa]", "click", function (e) {
        var a = e.currentTarget.getAttribute("data-sa");
        if (a === "pause") speechPause();
        else if (a === "stop") speechStop();
        else if (a === "replay") speechReplay();
      });
      var playBtns = app.querySelectorAll('[data-sp="play"]');
      playBtns.forEach(function (b) {
        b.addEventListener("click", function () {
          if (speech.paused) {
            speechResume();
          }
        });
      });

      // onboarding nav
      var back = app.querySelector("#navBack");
      if (back) back.addEventListener("click", prevStep);
      var next = app.querySelector("#navNext");
      if (next)
        next.addEventListener("click", function () {
          var id = ONB_STEPS[state.step];
          if (id === "needs2") {
            state.step = stepIndex("preview");
            render(true);
            announceStep();
            return;
          }
          nextStep();
        });

      // preview flow
      var pp = app.querySelector("#prevPreview");
      if (pp)
        pp.addEventListener("click", function () {
          state.previewPage = Math.max(0, state.previewPage - 1);
          render(true);
        });
      var np = app.querySelector("#nextPreview");
      if (np)
        np.addEventListener("click", function () {
          state.previewPage = Math.min(
            PREVIEW_PAGES.length - 1,
            state.previewPage + 1,
          );
          render(true);
        });
      var ec = app.querySelector("#editChoices");
      if (ec)
        ec.addEventListener("click", function () {
          goStep("buttons");
        });
      var lg = app.querySelector("#looksGood");
      if (lg)
        lg.addEventListener("click", function () {
          state.onboardingComplete = true;
          saveState();
          go("browse");
          announce("Setup complete. Showing events.");
        });

      // welcome autofocus button also serves as next (already navNext id)

      // browse screen
      var openFilters = app.querySelector("#openFilters");
      if (openFilters)
        openFilters.addEventListener("click", function () {
          state._filterDraft = JSON.parse(JSON.stringify(state.filters));
          state.filterPage = 0;
          go("filters");
        });
      var clearFilters = app.querySelector("#clearFilters");
      if (clearFilters)
        clearFilters.addEventListener("click", function () {
          update({
            filters: { time: "upcoming", activities: [] },
            browsePage: 0,
          });
          announce("Filters cleared.");
        });
      var goSettings = app.querySelector("#goSettings");
      if (goSettings)
        goSettings.addEventListener("click", function () {
          go("settings");
        });
      var prevEvent = app.querySelector("#prevEvent");
      if (prevEvent)
        prevEvent.addEventListener("click", function () {
          update({ browsePage: Math.max(0, state.browsePage - 1) });
        });
      var nextEvent = app.querySelector("#nextEvent");
      if (nextEvent)
        nextEvent.addEventListener("click", function () {
          update({ browsePage: state.browsePage + 1 });
        });
      var skipEvent = app.querySelector("#skipEvent");
      if (skipEvent)
        skipEvent.addEventListener("click", function () {
          update({ browsePage: state.browsePage + 1 });
        });
      var viewEvent = app.querySelector("#viewEvent");
      if (viewEvent)
        viewEvent.addEventListener("click", function () {
          go("details", {
            activeEventId: parseInt(viewEvent.getAttribute("data-id"), 10),
          });
        });
      on(app, "[data-view]", "click", function (e) {
        go("details", {
          activeEventId: parseInt(
            e.currentTarget.getAttribute("data-view"),
            10,
          ),
        });
      });
      var prevPage = app.querySelector("#prevPage");
      if (prevPage)
        prevPage.addEventListener("click", function () {
          update({ browsePage: Math.max(0, state.browsePage - 1) });
        });
      var nextPage = app.querySelector("#nextPage");
      if (nextPage)
        nextPage.addEventListener("click", function () {
          update({ browsePage: state.browsePage + 1 });
        });

      // filters screen
      var filterBack = app.querySelector("#filterBack");
      if (filterBack)
        filterBack.addEventListener("click", function () {
          if (state.filterPage === 0) {
            go("browse");
          } else {
            state.filterPage--;
            render(true);
          }
        });
      var filterNext = app.querySelector("#filterNext");
      if (filterNext)
        filterNext.addEventListener("click", function () {
          state.filterPage++;
          render(true);
        });
      var applyFilters = app.querySelector("#applyFilters");
      if (applyFilters)
        applyFilters.addEventListener("click", function () {
          update({ filters: state._filterDraft, browsePage: 0 }, {});
          go("browse");
          announce("Filters applied.");
        });

      // details / register
      var backToBrowse = app.querySelector("#backToBrowse");
      if (backToBrowse)
        backToBrowse.addEventListener("click", function () {
          go("browse");
        });
      var doRegister = app.querySelector("#doRegister");
      if (doRegister)
        doRegister.addEventListener("click", function () {
          go("register");
        });
      var regBackDetails = app.querySelector("#regBackDetails");
      if (regBackDetails)
        regBackDetails.addEventListener("click", function () {
          go("details");
        });
      var regDone = app.querySelector("#regDone");
      if (regDone)
        regDone.addEventListener("click", function () {
          go("browse");
        });

      // settings
      var settingsBack = app.querySelector("#settingsBack");
      if (settingsBack)
        settingsBack.addEventListener("click", function () {
          go("browse");
        });
      on(app, "[data-edit]", "click", function (e) {
        startEdit(e.currentTarget.getAttribute("data-edit"), "settings");
      });

      // editing footer override: if editing, replace next/back semantics
      if (state.editing) {
        var footer = app.querySelector(".scr-footer");
        var editingId = ONB_STEPS[state.step];
        if (footer && editingId === "needs1") {
          footer.innerHTML =
            '<div></div><div></div><button class="btn btn-primary" id="editNextNeeds"><span>Next</span>' +
            icon("chevronRight") +
            "</button>";
          footer
            .querySelector("#editNextNeeds")
            .addEventListener("click", function () {
              goStep("needs2");
            });
        } else if (footer) {
          footer.innerHTML =
            '<button class="btn btn-primary" id="doneEdit">' +
            icon("check") +
            "<span>Save & Return to Settings</span></button><div></div><div></div>";
          footer
            .querySelector("#doneEdit")
            .addEventListener("click", finishEdit);
        }
      }
    }

    /* ============================= INIT ============================= */
    window.addEventListener("resize", function () {
      render(false);
    });
    loadState();
    render(true);
  })();
</script>
